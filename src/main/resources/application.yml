server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: taskflow
  datasource:
    url: jdbc:h2:mem:taskflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.logistics.taskflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO
